
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Universo de Estrelas</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #030510;
    color: white;
    font-family: Georgia, serif;
    overflow: hidden;
    height: 100vh;
}

/* Céu estrelado */
#space {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

/* Nebulosa */
.nebula {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, #42205b55, transparent 50%),
      radial-gradient(ellipse at 80% 70%, #172d6b55, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #541e4b22, transparent 60%);
    z-index: -1;
}

/* Lua */
.moon {
    position: absolute;
    top: 12%;
    right: 15%;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    background: #f5edda;
    box-shadow:
        0 0 25px #fff5d9,
        0 0 70px #c7b9ff55;
}

/* Conteúdo */
.content {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

h1 {
    font-size: clamp(35px, 7vw, 65px);
    font-weight: normal;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #c9b6ff88;
    animation: appear 3s ease;
}

p {
    margin-top: 20px;
    color: #c4c3d8;
    font-size: 17px;
    letter-spacing: 2px;
    animation: appear 4s ease;
}

button {
    margin-top: 35px;
    padding: 13px 27px;
    border: 1px solid #a99bd8;
    border-radius: 30px;
    background: #ffffff08;
    color: white;
    font-family: Georgia, serif;
    font-size: 15px;
    cursor: pointer;
    transition: .4s;
}

button:hover {
    background: #a99bd822;
    box-shadow: 0 0 25px #a99bd855;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Estrelas cadentes */
.shooting-star {
    position: fixed;
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, white, transparent);
    transform: rotate(-35deg);
    filter: drop-shadow(0 0 6px white);
    animation: shoot 1.5s linear forwards;
    pointer-events: none;
}

@keyframes shoot {
    from {
        opacity: 1;
        transform: translate(0, 0) rotate(-35deg);
    }
    to {
        opacity: 0;
        transform: translate(-350px, 350px) rotate(-35deg);
    }
}

/* Rodapé */
footer {
    position: absolute;
    bottom: 20px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #77758f;
}
</style>
</head>

<body>

<canvas id="space"></canvas>
<div class="nebula"></div>
<div class="moon"></div>

<main class="content">
    <h1>Um Universo de Estrelas</h1>

    <p>
        Existem infinitas estrelas no céu,<br>
        e cada uma guarda sua própria beleza.
    </p>

    <button onclick="createShootingStar()">
        ✧ Faça um pedido
    </button>

    <footer>UM PEQUENO UNIVERSO</footer>
</main>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let stars = [];
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    stars = [];

    for (let i = 0; i < 230; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.6 + 0.3,
            alpha: Math.random(),
            speed: Math.random() * 0.015 + 0.003,
            direction: Math.random() > 0.5 ? 1 : -1
        });
    }
}

function drawConstellation() {
    const points = [
        [0.15, 0.25],
        [0.22, 0.18],
        [0.28, 0.27],
        [0.35, 0.20],
        [0.42, 0.31],
        [0.48, 0.24]
    ];

    ctx.beginPath();
    ctx.strokeStyle = "rgba(180,190,255,0.20)";
    ctx.lineWidth = 1;

    points.forEach((point, i) => {
        const x = point[0] * width;
        const y = point[1] * height;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    });

    ctx.stroke();

    points.forEach(point => {
        const x = point[0] * width;
        const y = point[1] * height;

        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#aabaff";
        ctx.fill();
        ctx.shadowBlur = 0;
    });
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    stars.forEach(star => {
        star.alpha += star.speed * star.direction;

        if (star.alpha >= 1 || star.alpha <= 0.15) {
            star.direction *= -1;
        }

        ctx.beginPath();
        ctx.arc(
            star.x,
            star.y,
            star.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ffffff";
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    drawConstellation();
    requestAnimationFrame(animate);
}

function createShootingStar() {
    const star = document.createElement("div");
    star.className = "shooting-star";

    star.style.left = Math.random() * 90 + 10 + "%";
    star.style.top = Math.random() * 50 + "%";

    document.body.appendChild(star);

    setTimeout(() => star.remove(), 1500);
}

window.addEventListener("resize", resize);

resize();
animate();

// Estrelas cadentes automáticas
setInterval(() => {
    if (Math.random() > 0.4) {
        createShootingStar();
    }
}, 3500);

</script>

</body>
</html>
